; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv

lib_deps = 
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ILI9341@^1.5.12
    ; Alternatif 1: Library Modbus yang lebih umum
    https://github.com/4-20ma/ModbusMaster.git
    ; Alternatif 2: eModbus
    # https://github.com/emelianov/modbus-esp8266.git
    tzapu/WiFiManager@^2.0.16-beta
    links2004/WebSockets@^2.7.3
    hideakitai/MQTTPubSubClient@^0.3.2
    bblanchon/ArduinoJson@7.4.2

build_flags = 
    -D DEBUG_MODBUS=0
    -D AERASEA_LOGO_WIDTH=128
    -D AERASEA_LOGO_HEIGHT=64
    -D AQUANOTES_FW_VERSION=\"2.2.0\"

upload_speed = 921600
monitor_filters = direct

[env:esp32-s3-generic]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D AQUANOTES_GENERIC_BUILD=1
